name: x86-64 Pull and Save Docker Image
on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '请填写docker镜像名称 多个用英文逗号分开'
        required: true
        default: 'alpine:latest,busybox:stable-glibc'  # 设置默认的 Docker 镜像列表

# 赋予工作流向仓库写入 Tag 和 Release 的权限
permissions:
  contents: write

jobs:
  pull_and_package:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean up Docker to free space
      run: |
          docker system prune -a -f
          docker volume prune -f

    - name: Pull Docker Images and Package
      run: |
        images="${{ github.event.inputs.docker_images }}"
          IFS=',' read -r -a image_array <<< "$images"
          for image in "${image_array[@]}"; do
            docker pull "${image}" --platform "linux/amd64"
            image_name="${image//\//_}"
            image_name="${image_name//:/_}"
            docker save "${image}" -o "${image_name}-amd64.tar"
            gzip -c "${image_name}-amd64.tar" > "${image_name}-amd64.tar.gz"
            rm "${image_name}-amd64.tar"
          done

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-artifact
        path: ${{ github.workspace }}/*.tar.gz
        retention-days: 1  # 将保留天数设置为 1 天 最多可设置90天

    # 新增步骤 1：生成一个基于当前时间戳的唯一 Tag 名称
    - name: Generate Tag Name
      id: tag
      run: |
        echo "release_tag=docker-images-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    # 新增步骤 2：自动创建 Git Tag 并发布 Release，同时把 .tar.gz 文件放进去
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: Docker Images Download (${{ steps.tag.outputs.release_tag }})
        body: |
          手动触发生成的 Docker 镜像包。
          包含镜像: `${{ github.event.inputs.docker_images }}`
        draft: false
        prerelease: false
        files: ${{ github.workspace }}/*.tar.gz
